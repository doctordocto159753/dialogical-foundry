[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dialogical-foundry"
version = "1.0.0"
description = "Local-first multi-model dialogue pipeline for development-ready work packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.66,<1",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "openai>=1.99,<3",
  "pydantic>=2.11,<3",
  "pypdf>=5.9,<7",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "pytest-cov>=6.2,<8", "ruff>=0.12,<1"]

[project.scripts]
foundry = "server.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["engine", "server", "pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
